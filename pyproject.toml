[project]
name = "data-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.10",
    "botocore[crt]>=1.43.10",
    "pika>=1.4.0",
]

[project.optional-dependencies]
worker = [
    "whisperx",
    "docling",
    "jinja2",
    "openai",
    "requests",
    "ocrmypdf"
]

[project.scripts]
populator = "populator.populator:main"
worker = "worker.worker:main"
collector = "collector.collector:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["populator", "worker", "collector"]

